<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FAB Counter</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/player.css" />
    <link rel="stylesheet" href="css/combat-chain.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>

    <div id="app">

      <!-- PLAYER 1 — left -->
      <section class="player player--left" id="player1" data-player="1">

        <button class="turn-bar" data-player="1" aria-label="End Player 1 turn"></button>

        <div class="player__inner">
          <div class="counter counter--life">
            <button class="counter__btn counter__btn--dec" data-counter="life" data-delta="-1" aria-label="Decrease life">−</button>
            <span class="counter__value" id="p1-life">40</span>
            <button class="counter__btn counter__btn--inc" data-counter="life" data-delta="1" aria-label="Increase life">+</button>
          </div>

          <div class="counter counter--pitch">
            <button class="counter__btn counter__btn--dec" data-counter="pitch" data-delta="-1" aria-label="Decrease pitch">−</button>
            <div class="pitch-disc">
              <span class="counter__value" id="p1-pitch">0</span>
            </div>
            <button class="counter__btn counter__btn--inc" data-counter="pitch" data-delta="1" aria-label="Increase pitch">+</button>
          </div>

          <div class="counter counter--ap">
            <button class="counter__btn counter__btn--dec" data-counter="ap" data-delta="-1" aria-label="Decrease action points">−</button>
            <span class="counter__value" id="p1-ap">0</span>
            <button class="counter__btn counter__btn--inc" data-counter="ap" data-delta="1" aria-label="Increase action points">+</button>
            <span class="counter__label">action points</span>
          </div>
        </div>

      </section>

      <!-- CENTER — flesh icon (collapsed) / combat chain (expanded) -->
      <div class="center" id="center">
        <span class="center__divider" aria-hidden="true"></span>

        <button class="cc-open-btn" id="cc-open-btn" aria-label="Open combat chain"></button>

        <section class="cc-panel" id="cc-panel" aria-label="Combat Chain">

          <div class="cc-keywords" role="group" aria-label="Attack keywords">
            <button class="cc-keyword" data-keyword="go-again"  aria-pressed="false">go again</button>
            <button class="cc-keyword" data-keyword="dominate"  aria-pressed="false">dominate</button>
            <button class="cc-keyword" data-keyword="on-hit"    aria-pressed="false">on hit</button>
            <button class="cc-keyword" data-keyword="piercing"  aria-pressed="false">piercing</button>
            <button class="cc-keyword" data-keyword="overpower" aria-pressed="false">overpower</button>
            <button class="cc-keyword" data-keyword="other"     aria-pressed="false">other</button>
          </div>

          <div class="cc-attack-row">
            <button class="cc-attack-btn cc-attack-btn--minus" id="cc-attack-minus" aria-label="Decrease attack">−</button>
            <button class="cc-attack-value" id="cc-attack-value" aria-pressed="false" aria-label="Toggle attack hit">0</button>
            <button class="cc-attack-btn cc-attack-btn--plus"  id="cc-attack-plus"  aria-label="Increase attack">+</button>
          </div>

          <div class="cc-nav">
            <button class="cc-nav-btn" id="cc-prev" aria-label="Previous chain link" disabled>&#8592;</button>
            <span class="cc-link-indicator" id="cc-link-indicator">Link 1 of 1</span>
            <button class="cc-nav-btn" id="cc-next" aria-label="Next chain link" disabled>&#8594;</button>
          </div>

          <div class="cc-actions">
            <button class="cc-next-link-btn" id="cc-next-link-btn">next link</button>
            <button class="cc-close-btn" id="cc-close-btn">close chain</button>
          </div>

        </section>
      </div>

      <!-- PLAYER 2 — right -->
      <section class="player player--right" id="player2" data-player="2">

        <button class="turn-bar" data-player="2" aria-label="End Player 2 turn"></button>

        <div class="player__inner">
          <div class="counter counter--life">
            <button class="counter__btn counter__btn--dec" data-counter="life" data-delta="-1" aria-label="Decrease life">−</button>
            <span class="counter__value" id="p2-life">40</span>
            <button class="counter__btn counter__btn--inc" data-counter="life" data-delta="1" aria-label="Increase life">+</button>
          </div>

          <div class="counter counter--pitch">
            <button class="counter__btn counter__btn--dec" data-counter="pitch" data-delta="-1" aria-label="Decrease pitch">−</button>
            <div class="pitch-disc">
              <span class="counter__value" id="p2-pitch">0</span>
            </div>
            <button class="counter__btn counter__btn--inc" data-counter="pitch" data-delta="1" aria-label="Increase pitch">+</button>
          </div>

          <div class="counter counter--ap">
            <button class="counter__btn counter__btn--dec" data-counter="ap" data-delta="-1" aria-label="Decrease action points">−</button>
            <span class="counter__value" id="p2-ap">0</span>
            <button class="counter__btn counter__btn--inc" data-counter="ap" data-delta="1" aria-label="Increase action points">+</button>
            <span class="counter__label">action points</span>
          </div>
        </div>

      </section>

    </div><!-- /#app -->

    <script src="js/state.js"></script>
    <script src="js/player.js"></script>
    <script src="js/combat-chain.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
