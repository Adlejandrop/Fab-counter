<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FAB Counter</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/player.css" />
    <link rel="stylesheet" href="css/combat-chain.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>

    <div id="app">

      <!-- PLAYER 2 — top, rotated 180° (identical DOM to P1; rotation mirrors it) -->
      <section class="player player--top" id="player2" data-player="2">
        <div class="player__indicators">
          <div class="player__pitch" id="p2-pitch" aria-label="Pitch resources">
            <button class="pitch-dot pitch-dot--red"    data-color="red"    aria-label="Red pitch 1"></button>
            <button class="pitch-dot pitch-dot--yellow" data-color="yellow" aria-label="Yellow pitch 2"></button>
            <button class="pitch-dot pitch-dot--blue"   data-color="blue"   aria-label="Blue pitch 3"></button>
          </div>
          <div class="player__ap" id="p2-ap" aria-label="Action points">
            <button class="player__ap-btn player__ap-btn--dec" aria-label="Decrease action points">−</button>
            <span class="player__ap-value" id="p2-ap-value">0</span>
            <button class="player__ap-btn player__ap-btn--inc" aria-label="Increase action points">+</button>
          </div>
        </div>

        <div class="player__life-zone">
          <button class="player__life-tap player__life-tap--decrease" data-action="decrease" aria-label="Decrease life"></button>
          <div class="player__life-display">
            <span class="player__life-number" id="p2-life">20</span>
          </div>
          <button class="player__life-tap player__life-tap--increase" data-action="increase" aria-label="Increase life"></button>
        </div>

        <div class="player__turn-row">
          <button class="player__turn-btn" id="p2-turn-btn" aria-pressed="false" aria-label="Set Player 2 as active player"></button>
        </div>
      </section>

      <!-- CENTRAL DIVIDER -->
      <div class="center-bar">
        <button class="combat-chain-btn" id="combat-chain-btn" aria-haspopup="dialog" aria-expanded="false">
          Combat Chain
        </button>
        <button class="cc-main-close-btn" id="cc-main-close-btn" aria-label="Close active chain" hidden>
          Close Chain
        </button>
      </div>

      <!-- PLAYER 1 — bottom -->
      <section class="player player--bottom" id="player1" data-player="1">
        <div class="player__indicators">
          <div class="player__pitch" id="p1-pitch" aria-label="Pitch resources">
            <button class="pitch-dot pitch-dot--red"    data-color="red"    aria-label="Red pitch 1"></button>
            <button class="pitch-dot pitch-dot--yellow" data-color="yellow" aria-label="Yellow pitch 2"></button>
            <button class="pitch-dot pitch-dot--blue"   data-color="blue"   aria-label="Blue pitch 3"></button>
          </div>
          <div class="player__ap" id="p1-ap" aria-label="Action points">
            <button class="player__ap-btn player__ap-btn--dec" aria-label="Decrease action points">−</button>
            <span class="player__ap-value" id="p1-ap-value">1</span>
            <button class="player__ap-btn player__ap-btn--inc" aria-label="Increase action points">+</button>
          </div>
        </div>

        <div class="player__life-zone">
          <button class="player__life-tap player__life-tap--decrease" data-action="decrease" aria-label="Decrease life"></button>
          <div class="player__life-display">
            <span class="player__life-number" id="p1-life">20</span>
          </div>
          <button class="player__life-tap player__life-tap--increase" data-action="increase" aria-label="Increase life"></button>
        </div>

        <div class="player__turn-row">
          <button class="player__turn-btn is-active" id="p1-turn-btn" aria-pressed="true" aria-label="Set Player 1 as active player"></button>
        </div>
      </section>

    </div><!-- /#app -->

    <!-- COMBAT CHAIN OVERLAY -->
    <div class="cc-overlay" id="cc-overlay" role="dialog" aria-modal="true" aria-label="Combat Chain" hidden>
      <div class="cc-panel">

        <header class="cc-header">
          <span class="cc-title">Combat Chain</span>
        </header>

        <div class="cc-nav">
          <button class="cc-nav-btn" id="cc-prev" aria-label="Previous chain link" disabled>&#8592;</button>
          <span class="cc-link-indicator" id="cc-link-indicator">Link 1 of 1</span>
          <button class="cc-nav-btn" id="cc-next" aria-label="Next chain link" disabled>&#8594;</button>
        </div>

        <div class="cc-attack-row">
          <button class="cc-attack-btn cc-attack-btn--minus" id="cc-attack-minus" aria-label="Decrease attack">−</button>
          <span class="cc-attack-value" id="cc-attack-value">0</span>
          <button class="cc-attack-btn cc-attack-btn--plus"  id="cc-attack-plus"  aria-label="Increase attack">+</button>
        </div>

        <div class="cc-keywords" role="group" aria-label="Attack keywords">
          <button class="cc-keyword" data-keyword="go-again"  aria-pressed="false">Go Again</button>
          <button class="cc-keyword" data-keyword="dominate"  aria-pressed="false">Dominate</button>
          <button class="cc-keyword" data-keyword="overpower" aria-pressed="false">Overpower</button>
        </div>

        <div class="cc-actions">
          <button class="cc-next-link-btn" id="cc-next-link-btn">Next Chain Link</button>
          <button class="cc-close-btn" id="cc-close-btn">Close Chain</button>
        </div>

      </div>
    </div><!-- /.cc-overlay -->

    <script src="js/state.js"></script>
    <script src="js/player.js"></script>
    <script src="js/pitch.js"></script>
    <script src="js/combat-chain.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
